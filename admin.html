<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Rent Camera</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#070912;
      --surface:#11172f;
      --surface2:#0f1430;
      --accent:#E22F80;
      --accent-alt:#8140DC;
      --muted:#9ca6c8;
      --text:#eef2ff;
      --border:rgba(255,255,255,0.08);
    }
    body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(180deg,#050610,#111a2f);color:var(--text);padding:20px}
    .navbar{display:flex;justify-content:space-between;align-items:center;background:rgba(11,7,23,0.94);backdrop-filter:blur(18px);padding:16px 24px;border-radius:16px;margin-bottom:24px;border:1px solid var(--border)}
    .navbar h1{font-size:1.3rem;font-weight:800;margin:0}
    .navbar h1 span{color:var(--accent)}
    .navbar-right{display:flex;gap:16px;align-items:center}
    .user-info{font-size:0.9rem;color:var(--muted)}
    .btn-logout{background:rgba(226,47,128,0.16);color:var(--accent);border:1px solid rgba(226,47,128,0.3);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;transition:all 0.2s}
    .btn-logout:hover{background:rgba(226,47,128,0.24)}
    .container{max-width:1200px;margin:0 auto}
    .tabs{display:flex;gap:12px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px}
    .tab{background:none;border:none;padding:10px 16px;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:all 0.2s}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .section-header h2{font-size:1.4rem}
    .btn-add{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;font-weight:600;transition:all 0.2s}
    .btn-add:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(226,47,128,0.3)}
    table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:0.9rem}
    th{background:rgba(255,255,255,0.08);font-weight:700;color:var(--text)}
    tr:hover{background:rgba(255,255,255,0.06)}
    .status-badge{display:inline-block;padding:6px 12px;border-radius:6px;font-size:0.8rem;font-weight:600}
    .status-ordered{background:rgba(226,47,128,0.16);color:#ffc4d6}
    .actions{display:flex;gap:8px}
    .btn-edit,.btn-delete{border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all 0.2s}
    .btn-edit{background:rgba(129,64,220,0.16);color:#d9ccff}
    .btn-edit:hover{background:rgba(129,64,220,0.24)}
    .btn-delete{background:rgba(255,0,0,0.16);color:#ff9999}
    .btn-delete:hover{background:rgba(255,0,0,0.24)}
    .loading{text-align:center;padding:20px;color:var(--muted)}
    .error{color:#ff7b7b;padding:12px 14px;background:rgba(255,0,0,0.1);border-radius:8px;margin-bottom:16px}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
    .modal.open{display:flex}
    .modal-content{background:linear-gradient(180deg,#11172f,#0d1330);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-header h3{font-size:1.2rem}
    .modal-close{background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:0.9rem;font-weight:600;margin-bottom:6px;color:var(--text)}
    .form-group input,.form-group textarea{width:100%;padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.9rem}
    .form-group input:focus,.form-group textarea:focus{outline:none;background:rgba(255,255,255,0.08);border-color:var(--accent)}
    .form-actions{display:flex;gap:12px;margin-top:24px}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:600;flex:1}
    .btn-primary:hover{opacity:0.9}
    .btn-secondary{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);flex:1;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:600}
    .btn-secondary:hover{background:rgba(255,255,255,0.1)}
    .alert{padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none}
    .alert.show{display:block}
    .alert.success{background:rgba(76,175,80,0.16);color:#a8e6a1;border:1px solid rgba(76,175,80,0.3)}
    .alert.error{background:rgba(255,0,0,0.16);color:#ff9999;border:1px solid rgba(255,0,0,0.3)}
  </style>
</head>
<body>
  <div class="navbar">
    <h1>Rent<span>Camera</span> Admin</h1>
    <div class="navbar-right">
      <div class="user-info">Admin: <strong id="user-name">-</strong></div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orders')">📦 Daftar Pesanan</button>
      <button class="tab" onclick="switchTab('cameras')">📷 Katalog Kamera</button>
    </div>

    <!-- Orders Tab -->
    <div id="orders" class="tab-content active">
      <div class="section-header">
        <h2>Daftar Pesanan</h2>
      </div>
      <div id="alert-orders" class="alert"></div>
      <div id="orders-container">
        <div class="loading">Memuat data...</div>
      </div>
    </div>

    <!-- Cameras Tab -->
    <div id="cameras" class="tab-content">
      <div class="section-header">
        <h2>Katalog Kamera</h2>
        <button class="btn-add" onclick="openAddCameraModal()">+ Tambah Kamera</button>
      </div>
      <div id="alert-cameras" class="alert"></div>
      <div id="cameras-container">
        <div class="loading">Memuat data...</div>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Camera -->
  <div id="cameraModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Tambah Kamera</h3>
        <button class="modal-close" onclick="closeCameraModal()">&times;</button>
      </div>
      <form onsubmit="saveCam(event)">
        <div class="form-group">
          <label>Nama Kamera</label>
          <input type="text" id="cam-name" placeholder="Misal: Sony Cybershot WX220" required>
        </div>
        <div class="form-group">
          <label>Merek & Tipe</label>
          <input type="text" id="cam-sub" placeholder="Misal: Sony · Standard" required>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <input type="text" id="cam-cat" placeholder="standard, premium, atau aksesoris" required>
        </div>
        <div class="form-group">
          <label>Harga / Hari (Rp)</label>
          <input type="number" id="cam-price" placeholder="50000" required min="0">
        </div>
        <div class="form-group">
          <label>Gambar Kamera</label>
          <input type="text" id="cam-icon" placeholder="Emoji 📷 atau URL https://example.com/image.jpg" required>
          <small style="color:var(--muted);display:block;margin-top:6px;font-size:0.8rem">Gunakan emoji atau URL lengkap untuk gambar</small>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Simpan</button>
          <button type="button" class="btn-secondary" onclick="closeCameraModal()">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let editingCameraId = null;

    // Check login
    async function checkLogin() {
      try {
        const response = await fetch('/api/session');
        if (!response.ok) {
          window.location.href = '/login';
          return;
        }
        const data = await response.json();
        document.getElementById('user-name').textContent = data.user.username;
      } catch {
        window.location.href = '/login';
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'orders') loadOrders();
      else if (tabName === 'cameras') loadCameras();
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/admin/orders');
        if (!response.ok) throw new Error('Gagal memuat pesanan');
        
        const orders = await response.json();
        const container = document.getElementById('orders-container');
        
        if (orders.length === 0) {
          container.innerHTML = '<p class="loading">Belum ada pesanan</p>';
          return;
        }

        let html = '<table><thead><tr><th>ID</th><th>Kamera</th><th>Pelanggan</th><th>Mulai</th><th>Selesai</th><th>Durasi</th><th>Total</th><th>Telepon</th></tr></thead><tbody>';
        orders.forEach(order => {
          html += `<tr>
            <td>${order.id}</td>
            <td>${order.cameraName}</td>
            <td>${order.name}</td>
            <td>${order.start}</td>
            <td>${order.end}</td>
            <td>${order.duration} hari</td>
            <td>Rp ${order.total.toLocaleString()}</td>
            <td>${order.phone}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (err) {
        document.getElementById('orders-container').innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    async function loadCameras() {
      try {
        const response = await fetch('/api/cameras');
        if (!response.ok) throw new Error('Gagal memuat kamera');
        
        const cameras = await response.json();
        const container = document.getElementById('cameras-container');
        
        if (cameras.length === 0) {
          container.innerHTML = '<p class="loading">Belum ada kamera</p>';
          return;
        }

        let html = '<table><thead><tr><th>Gambar</th><th>Nama</th><th>Merek</th><th>Kategori</th><th>Harga/Hari</th><th>Tindakan</th></tr></thead><tbody>';
        cameras.forEach(cam => {
          const isUrl = cam.icon.startsWith('http');
          const imgHtml = isUrl 
            ? `<img src="${cam.icon}" style="width:50px;height:50px;object-fit:cover;border-radius:8px" alt="${cam.name}" onerror="this.style.display='none'">`
            : `<div style="font-size:1.8rem;text-align:center">${cam.icon}</div>`;
          html += `<tr>
            <td>${imgHtml}</td>
            <td>${cam.name}</td>
            <td>${cam.sub}</td>
            <td>${cam.cat}</td>
            <td>Rp ${cam.price.toLocaleString()}</td>
            <td>
              <div class="actions">
                <button class="btn-edit" onclick="editCamera(${cam.id}, '${cam.name.replace(/'/g, "\\'")}', '${cam.sub.replace(/'/g, "\\'")}', '${cam.cat}', ${cam.price}, '${cam.icon.replace(/'/g, "\\'")}')"Ssyle>Edit</button>
                <button class="btn-delete" onclick="deleteCam(${cam.id})">Hapus</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (err) {
        document.getElementById('cameras-container').innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    function openAddCameraModal() {
      editingCameraId = null;
      document.getElementById('modalTitle').textContent = 'Tambah Kamera';
      document.getElementById('cam-name').value = '';
      document.getElementById('cam-sub').value = '';
      document.getElementById('cam-cat').value = '';
      document.getElementById('cam-price').value = '';
      document.getElementById('cam-icon').value = '';
      document.getElementById('cameraModal').classList.add('open');
    }

    function editCamera(id, name, sub, cat, price, icon) {
      editingCameraId = id;
      document.getElementById('modalTitle').textContent = 'Edit Kamera';
      document.getElementById('cam-name').value = name;
      document.getElementById('cam-sub').value = sub;
      document.getElementById('cam-cat').value = cat;
      document.getElementById('cam-price').value = price;
      document.getElementById('cam-icon').value = icon;
      document.getElementById('cameraModal').classList.add('open');
    }

    function closeCameraModal() {
      document.getElementById('cameraModal').classList.remove('open');
      editingCameraId = null;
    }

    async function saveCam(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('cam-name').value,
        sub: document.getElementById('cam-sub').value,
        cat: document.getElementById('cam-cat').value,
        price: document.getElementById('cam-price').value,
        icon: document.getElementById('cam-icon').value
      };

      try {
        const method = editingCameraId ? 'PUT' : 'POST';
        const url = editingCameraId ? `/api/admin/cameras/${editingCameraId}` : '/api/admin/cameras';
        
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        
        if (!response.ok) throw new Error(result.message);
        
        showAlert('alert-cameras', result.message, 'success');
        closeCameraModal();
        loadCameras();
      } catch (err) {
        showAlert('alert-cameras', err.message, 'error');
      }
    }

    async function deleteCam(id) {
      if (!confirm('Yakin ingin menghapus kamera ini?')) return;

      try {
        const response = await fetch(`/api/admin/cameras/${id}`, { method: 'DELETE' });
        const result = await response.json();
        
        if (!response.ok) throw new Error(result.message);
        
        showAlert('alert-cameras', result.message, 'success');
        loadCameras();
      } catch (err) {
        showAlert('alert-cameras', err.message, 'error');
      }
    }

    async function logout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (err) {
        console.error(err);
      }
    }

    function showAlert(id, message, type) {
      const alert = document.getElementById(id);
      alert.textContent = message;
      alert.className = `alert show ${type}`;
      setTimeout(() => {
        alert.classList.remove('show');
      }, 4000);
    }

    checkLogin();
  </script>
</body>
</html>
